<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F6F9">
  <title>{% block title %}{% endblock %} - CalcLearners</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="canonical" href="{{ request.base_url }}">
  <script src="/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%2315233B'/%3E%3Cpath d='M4 19 C 8 19, 9 7, 13.5 7 S 19 14, 22 12' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M8.5 4.5 L 19 10' stroke='%23F0B429' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <div class="top-bar">
      <a class="logo" href="/" aria-label="CalcLearners home">
        <svg viewBox="0 0 26 26" aria-hidden="true">
          <path class="logo-curve" d="M3 20 C 8 20, 9 6, 14 6 S 20 14, 23 12"/>
          <path class="logo-tangent" d="M8 3 L 20 9"/>
        </svg>
        <span>CalcLearners</span>
      </a>
    </div>
  </header>

  <main class="legal lesson-page" id="main">
{% block main %}{% endblock %}
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <span>CalcLearners, for students who want calculus to click.</span>
      <nav class="foot-legal" aria-label="Legal">
        <a href="/terms.html">Terms</a>
        <a href="/privacy.html">Privacy</a>
        <a href="/cookies.html">Cookies</a>
      </nav>
      <nav aria-label="More">
        <a href="/lessons">All lessons</a>
        <a href="/#/feedback">Send feedback</a>
      </nav>
    </div>
  </footer>

  <!-- integrity: the browser refuses these files if the CDN ever serves anything different -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <script src="/lesson.js"></script>
</body>
</html>
