  .lock { display: flex; align-items: center; gap: 8px; font: 800 20px/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.01em; }
  .lock svg { width: 26px; height: 26px; }
  .tiny { width: 16px; height: 16px; }
  h3 { margin: 0 0 6px; font-size: 14px; }
